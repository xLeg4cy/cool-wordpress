services:
  wordpress:
    image: wordpress:latest
    volumes:
      - ./config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./wp-content:/var/www/html/wp-content
      - wp-data:/var/www/html
    ports:
      - ${WP_PORT}:80
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=${SERVICE_USER_DB}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
    depends_on:
      - db
    entrypoint:
      - /bin/sh
      - -c
      - |
        # install dependencies
        if [ ! -f /usr/local/bin/composer ]; then
          # Install composer
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php
          # Install 7z
          apt-get update
          apt-get install -y p7zip-full
          # Clean apt cache
          apt-get clean
          rm -rf /var/lib/apt/lists/*
        fi
        # proxy default entrypoint
        exec /usr/local/bin/docker-entrypoint.sh apache2-foreground

  wordpress-cli:
    image: wordpress:cli
    volumes:
      - ./config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - wp-data:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=${SERVICE_USER_DB}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Wait for Database
        until printf '\n' | nc db 3306 > /dev/null 2>&1; do
          echo "Waiting for DB..."
          sleep 1
        done
        # Wait for wp-config.php
        until [ -f wp-config.php ]; do
          echo "Waiting for wp-config.php..."
          sleep 1
        done
        # Check if wp-settings.php exists; if not, download core files
        if [ ! -f wp-settings.php ]; then
          echo "WordPress files not found. Downloading..."
          wp core download
        fi
        # Now check if it needs installation
        if ! wp core is-installed; then
          echo "Installing WordPress..."
          wp core install \
            --url="http://localhost:${WP_PORT}" \
            --title="${WP_TITLE}" \
            --admin_user="${WP_USER}" \
            --admin_password="${WP_PASSWORD}" \
            --admin_email="${WP_EMAIL}"
        fi
        # Optional: execute passed arguments
        if [ $# -gt 0 ]; then
          wp "$@"
        fi

  db:
    image: mariadb:latest
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MARIADB_DATABASE=${DB_NAME:-wordpress}
      - MARIADB_USER=${SERVICE_USER_DB}
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_DB}

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - ${DB_PORT}:80
    environment:
      - PMA_HOST=db
      - PMA_USER=${SERVICE_USER_DB}
      - PMA_PASSWORD=${SERVICE_PASSWORD_DB}

volumes:
  db-data:
  wp-data:
